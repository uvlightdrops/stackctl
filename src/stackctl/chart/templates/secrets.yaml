{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels: {{- include "stackctl.labels" (dict "root" $) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.secretFiles }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-files
  labels: {{- include "stackctl.labels" (dict "root" $) | nindent 4 }}
type: Opaque
stringData:
  {{- range $file, $content := .Values.secretFiles }}
  {{ $file }}: {{ $content | quote }}
  {{- end }}
{{- end }}
